# 数据源配置 - 跨市场投资 Agent
# 依据 data-source-spec-v1.0.md 规范
# 原则：P0 > P1 > P2 > P3，关键指标 Fail Closed

version: "1.0"

# ============ 中国 ============
cn:
  # 中证指数估值（P0: 官方 OSS Excel）
  csindex_valuation:
    primary: CSINDEX_OFFICIAL
    base_url: "https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/file/autofile/indicator"
    # 指数代码 -> 说明
    indices:
      "000300": "沪深300"
      "000922": "中证红利"
    # 注意：官方只提供最近 ~20 个交易日，历史必须每日落库积累
    fail_policy: HARD_STOP
    note: "只给近期20天，必须日频落库"

  # 中国10年国债收益率（P0: ChinaBond 官方）
  gov_10y:
    primary: CHINABOND_OFFICIAL
    base_url: "https://yield.chinabond.com.cn/cbweb-pbc-web/pbc/historyQuery"
    params:
      gjqx: "0"          # 0=全部期限
      qxId: "hzsylqx"    # hzsylqx=中债国债收益率曲线
      locale: "cn_ZH"
    # 同源备用通道（底层仍是 ChinaBond，不能独立验证）
    fallback_transport: AKSHARE_CHINABOND
    # 独立备用（需 Tushare token）
    fallback_independent: TUSHARE_YC_CB
    fail_policy: HARD_STOP

# ============ 美国（P3 源，国内平台无 token） ============
# 用户决策：美国模块改用东方财富/腾讯，无需注册 FRED token
# ⚠️ P3 定位：仅趋势监控/外盘扫描/交叉验证，不独立触发估值 BUY
us:
  sp500:
    primary: TENCENT_QT          # usINX, 实时无token
    internal_id: "US_SP500"
    priority: "P3"
  nasdaq_composite:
    primary: TENCENT_QT          # usIXIC
    internal_id: "US_NASDAQ_COMPOSITE"
    priority: "P3"
  nasdaq100:
    primary: TENCENT_QT          # usNDX
    internal_id: "US_NASDAQ100"
    priority: "P3"
  gov_10y:
    primary: EASTMONEY           # bond_zh_us_rate 美国10Y, 无用户token
    internal_id: "US10Y"
    priority: "P3"
    fail_policy: HARD_STOP       # 美国10Y是收益率曲线监控关键指标

# ============ 校验阈值（依据规范第25节） ============
validation_thresholds:
  index_close:
    warning: 0.0005   # 0.05%
    hard_stop: 0.0015  # 0.15%
  pe:
    warning: 0.01     # 1%
    hard_stop: 0.02   # 2%
  dividend_yield:
    warning: 0.0005   # 0.05 pct
    hard_stop: 0.001  # 0.10 pct
  yield_10y:
    warning: 0.03     # 3 bp
    hard_stop: 0.05   # 5 bp
  security_identity:
    hard_stop: any_mismatch

# ============ 单位规范 ============
units:
  rate: "percentage_points"   # 1.69 表示 1.69%，不存 0.0169

# ============ ERP 计算口径（已定死，不得更改） ============
erp_calculation:
  formula: "erp = 100 / pe - yield_10y"
  pe_metric: "pe1_total_share"        # 用中证官方"市盈率1（总股本）"
  pe_symbol: "000300"                  # 沪深300
  pe_source: "CSINDEX_OFFICIAL"        # P0 官方源
  yield_metric: "yield_10y"
  yield_symbol: "CN10Y"
  yield_source: "CHINABOND_OFFICIAL"   # P0 官方源
  unit: "percentage_points"
  # 口径说明：静态市盈率（LYR，最近年报净利润），已知有 1-2 季度滞后
  # 未来接入 Tushare 后可用 pe_ttm 做交叉验证
  pe_caliber: "static_lyr_total_share"
